spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/dev_db}
    username: ${SPRING_DATASOURCE_USERNAME:dev_xh}
    password: ${SPRING_DATASOURCE_PASSWORD:dev_xh}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: caseplan
    distribution:
      # Export http.server.requests as a Prometheus histogram so p95/p99 can
      # be computed with histogram_quantile(). Without this, Micrometer exports
      # a summary (count/sum only) and quantiles are unavailable.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s

# Queue abstraction: set queue.provider to "redis" (local) or "sqs" (AWS Lambda)
queue:
  provider: ${QUEUE_PROVIDER:redis}
  sqs:
    queue-url: ${QUEUE_URL:}
    region: ${AWS_REGION:us-east-2}

# LLM abstraction: set llm.provider to "openai" (DeepSeek/OpenAI), "anthropic", or "mock" (canned text, no API calls)
llm:
  provider: ${LLM_PROVIDER:openai}
  openai:
    base-url: ${LLM_OPENAI_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_OPENAI_API_KEY:${DEEPSEEK_API_KEY:}}
    # DeepSeek V4 model. Override with deepseek-v4-pro for stronger reasoning.
    model: ${LLM_OPENAI_MODEL:deepseek-v4-flash}
    # Empty = preserve legacy DeepSeek chat behavior by disabling thinking for V4 models.
    # Set to enabled for thinking mode, or disabled for non-thinking mode.
    thinking-type: ${LLM_OPENAI_THINKING_TYPE:}
    reasoning-effort: ${LLM_OPENAI_REASONING_EFFORT:}
    model-refresh-seconds: ${LLM_OPENAI_MODEL_REFRESH_SECONDS:2592000}
    max-tokens: 4000
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    # Leave empty to auto-resolve latest model from /models.
    model: ${LLM_ANTHROPIC_MODEL:}
    model-refresh-seconds: ${LLM_ANTHROPIC_MODEL_REFRESH_SECONDS:2592000}
    max-tokens: 4000

# Legacy (still used if LLM_OPENAI_API_KEY not set)
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
