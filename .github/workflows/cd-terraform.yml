name: cd-terraform

# AWS environment is currently torn down (cost saving): the staging replica
# from the last deploy was never destroyed and the tfstate/frontend buckets
# are gone, so auto-triggered runs would fail at the orphan check.
# Run manually via workflow_dispatch, or restore the push/pull_request
# triggers below when the AWS environment is rebuilt.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment label (e.g. staging/prod)"
        required: true
        default: "staging"
      apply:
        description: "Run terraform apply"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

# Prevent parallel runs: only one CD pipeline at a time to avoid orphan staging replicas
concurrency:
  group: cd-terraform
  cancel-in-progress: false

env:
  TF_WORKING_DIR: infra/terraform-replica

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      VPC_ID: ${{ vars.VPC_ID }}
      LAMBDA_SUBNET_IDS_JSON: ${{ vars.LAMBDA_SUBNET_IDS_JSON }}
      ADDITIONAL_LAMBDA_SECURITY_GROUP_IDS_JSON: ${{ vars.ADDITIONAL_LAMBDA_SECURITY_GROUP_IDS_JSON }}
      RDS_SECURITY_GROUP_ID: ${{ vars.RDS_SECURITY_GROUP_ID }}
      SQS_VPCE_SECURITY_GROUP_ID: ${{ vars.SQS_VPCE_SECURITY_GROUP_ID }}
      DATASOURCE_URL: ${{ vars.DATASOURCE_URL }}
      DATASOURCE_USERNAME: ${{ vars.DATASOURCE_USERNAME }}
      CORS_ALLOW_ORIGINS_JSON: ${{ vars.CORS_ALLOW_ORIGINS_JSON }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      DATASOURCE_PASSWORD: ${{ secrets.DATASOURCE_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      CI_POSTGRES_DB: caseplan_ci
      CI_POSTGRES_USER: caseplan_ci
      CI_POSTGRES_PASSWORD: caseplan_ci_password
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: caseplan_ci
          POSTGRES_USER: caseplan_ci
          POSTGRES_PASSWORD: caseplan_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U caseplan_ci -d caseplan_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install PSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start Backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ env.CI_POSTGRES_DB }}
          SPRING_DATASOURCE_USERNAME: ${{ env.CI_POSTGRES_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ env.CI_POSTGRES_PASSWORD }}
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
        run: |
          nohup mvn -B spring-boot:run -Dspring-boot.run.arguments="--server.port=8080 --caseplan.consumer.enabled=false" > /tmp/backend.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          tail -100 /tmp/backend.log
          exit 1

      - name: Install JS Dependencies
        run: npm ci

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Run Frontend E2E
        env:
          FRONTEND_URL: http://localhost:8080
          E2E_PSQL: "PGPASSWORD=${{ env.CI_POSTGRES_PASSWORD }} psql -h localhost -U ${{ env.CI_POSTGRES_USER }} -d ${{ env.CI_POSTGRES_DB }}"
        run: npm run test:e2e

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION != '' && env.AWS_REGION || 'us-east-2' }}

      - name: Build Lambda Artifact
        run: |
          mvn -B -DskipTests package
          mkdir -p target/lambda/lib
          cd target/lambda
          jar xf ../legal-caseplan-0.0.1.jar BOOT-INF/classes BOOT-INF/lib META-INF
          cp -r BOOT-INF/classes/* .
          cp BOOT-INF/lib/* lib/
          rm -rf BOOT-INF
          zip -qr ../legal-caseplan-lambda.zip .

      - name: Verify No Orphan Staging Resources
        run: |
          set -euo pipefail
          echo "Checking for orphan caseplan-staging-* resources..."
          apis=$(aws apigatewayv2 get-apis --query "Items[?starts_with(Name, 'caseplan-staging')].Name" --output text 2>/dev/null || echo "")
          count=$(echo "$apis" | tr '\t' '\n' | grep -c . 2>/dev/null || echo "0")
          if [ "${count:-0}" -gt 0 ]; then
            echo "::error::Found $count orphan staging API(s): $apis"
            echo "Run manual cleanup or contact infra. Only the main pipeline should run."
            exit 1
          fi
          echo "No orphan staging resources found."

      - name: Validate Required CI Config
        run: |
          set -euo pipefail
          required=(VPC_ID LAMBDA_SUBNET_IDS_JSON RDS_SECURITY_GROUP_ID DATASOURCE_URL DATASOURCE_USERNAME DATASOURCE_PASSWORD TF_STATE_BUCKET TF_STATE_REGION TF_LOCK_TABLE AWS_ROLE_ARN)
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required config: $key"
              exit 1
            fi
          done

      - name: Render ci.auto.tfvars
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          : "${PROJECT_NAME:=caseplan}"
          : "${AWS_REGION:=us-east-2}"
          : "${ADDITIONAL_LAMBDA_SECURITY_GROUP_IDS_JSON:=[]}"
          : "${SQS_VPCE_SECURITY_GROUP_ID:=}"
          : "${CORS_ALLOW_ORIGINS_JSON:=[\"*\"]}"
          : "${LLM_PROVIDER:=openai}"
          : "${OPENAI_API_KEY:=}"
          : "${DEEPSEEK_API_KEY:=}"

          {
            echo "aws_region                           = \"${AWS_REGION}\""
            echo "project_name                         = \"${PROJECT_NAME}\""
            echo "environment                          = \"${DEPLOY_ENV}\""
            echo "vpc_id                               = \"${VPC_ID}\""
            echo "lambda_subnet_ids                    = ${LAMBDA_SUBNET_IDS_JSON}"
            echo "additional_lambda_security_group_ids = ${ADDITIONAL_LAMBDA_SECURITY_GROUP_IDS_JSON}"
            echo "rds_security_group_id                = \"${RDS_SECURITY_GROUP_ID}\""
            echo "sqs_vpce_security_group_id           = \"${SQS_VPCE_SECURITY_GROUP_ID}\""
            echo "datasource_url                       = \"${DATASOURCE_URL}\""
            echo "datasource_username                  = \"${DATASOURCE_USERNAME}\""
            echo "datasource_password                  = \"${DATASOURCE_PASSWORD}\""
            echo "llm_provider                         = \"${LLM_PROVIDER}\""
            echo "openai_api_key                       = \"${OPENAI_API_KEY}\""
            echo "deepseek_api_key                     = \"${DEEPSEEK_API_KEY}\""
            echo "cors_allow_origins                   = ${CORS_ALLOW_ORIGINS_JSON}"
          } > ci.auto.tfvars
          terraform fmt ci.auto.tfvars

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          key="${TF_STATE_KEY:-caseplan/${DEPLOY_ENV}/terraform.tfstate}"
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${key}" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ env.DEPLOY_ENV }}
          path: |
            infra/terraform-replica/tfplan
            target/legal-caseplan-lambda.zip

  apply:
    runs-on: ubuntu-latest
    needs: plan
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.apply == true)
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      VPC_ID: ${{ vars.VPC_ID }}
      LAMBDA_SUBNET_IDS_JSON: ${{ vars.LAMBDA_SUBNET_IDS_JSON }}
      ADDITIONAL_LAMBDA_SECURITY_GROUP_IDS_JSON: ${{ vars.ADDITIONAL_LAMBDA_SECURITY_GROUP_IDS_JSON }}
      RDS_SECURITY_GROUP_ID: ${{ vars.RDS_SECURITY_GROUP_ID }}
      SQS_VPCE_SECURITY_GROUP_ID: ${{ vars.SQS_VPCE_SECURITY_GROUP_ID }}
      DATASOURCE_URL: ${{ vars.DATASOURCE_URL }}
      DATASOURCE_USERNAME: ${{ vars.DATASOURCE_USERNAME }}
      CORS_ALLOW_ORIGINS_JSON: ${{ vars.CORS_ALLOW_ORIGINS_JSON }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      DATASOURCE_PASSWORD: ${{ secrets.DATASOURCE_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET != '' && vars.FRONTEND_S3_BUCKET || 'caseplan-frontend-727766004034-use2' }}
      FRONTEND_DISTRIBUTION_ID: ${{ vars.FRONTEND_DISTRIBUTION_ID != '' && vars.FRONTEND_DISTRIBUTION_ID || 'E23XI74DK4D2MF' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION != '' && env.AWS_REGION || 'us-east-2' }}

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ env.DEPLOY_ENV }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          key="${TF_STATE_KEY:-caseplan/${DEPLOY_ENV}/terraform.tfstate}"
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${key}" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      - name: Terraform Apply
        id: terraform-apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform Output
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output

      - name: Publish Frontend Index
        run: |
          aws s3 cp src/main/resources/static/index.html "s3://${FRONTEND_S3_BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate Frontend Cache
        continue-on-error: true
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${FRONTEND_DISTRIBUTION_ID}" \
            --paths "/" "/index.html"

      - name: Render ci.auto.tfvars
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          : "${PROJECT_NAME:=caseplan}"
          : "${AWS_REGION:=us-east-2}"
          : "${ADDITIONAL_LAMBDA_SECURITY_GROUP_IDS_JSON:=[]}"
          : "${SQS_VPCE_SECURITY_GROUP_ID:=}"
          : "${CORS_ALLOW_ORIGINS_JSON:=[\"*\"]}"
          : "${LLM_PROVIDER:=openai}"
          : "${OPENAI_API_KEY:=}"
          : "${DEEPSEEK_API_KEY:=}"

          {
            echo "aws_region                           = \"${AWS_REGION}\""
            echo "project_name                         = \"${PROJECT_NAME}\""
            echo "environment                          = \"${DEPLOY_ENV}\""
            echo "vpc_id                               = \"${VPC_ID}\""
            echo "lambda_subnet_ids                    = ${LAMBDA_SUBNET_IDS_JSON}"
            echo "additional_lambda_security_group_ids = ${ADDITIONAL_LAMBDA_SECURITY_GROUP_IDS_JSON}"
            echo "rds_security_group_id                = \"${RDS_SECURITY_GROUP_ID}\""
            echo "sqs_vpce_security_group_id           = \"${SQS_VPCE_SECURITY_GROUP_ID}\""
            echo "datasource_url                       = \"${DATASOURCE_URL}\""
            echo "datasource_username                  = \"${DATASOURCE_USERNAME}\""
            echo "datasource_password                  = \"${DATASOURCE_PASSWORD}\""
            echo "llm_provider                         = \"${LLM_PROVIDER}\""
            echo "openai_api_key                       = \"${OPENAI_API_KEY}\""
            echo "deepseek_api_key                     = \"${DEEPSEEK_API_KEY}\""
            echo "cors_allow_origins                   = ${CORS_ALLOW_ORIGINS_JSON}"
          } > ci.auto.tfvars
          terraform fmt ci.auto.tfvars

      - name: Terraform Destroy (ephemeral replica)
        if: steps.terraform-apply.outcome == 'success'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          key="${TF_STATE_KEY:-caseplan/${DEPLOY_ENV}/terraform.tfstate}"
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${key}" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}"
          # Lambda VPC ENIs release asynchronously after function deletion and
          # can briefly block SG deletion. Retry until they are gone.
          for attempt in 1 2 3 4 5; do
            if terraform destroy -input=false -auto-approve; then
              exit 0
            fi
            echo "destroy attempt ${attempt} failed; retrying in 60s..."
            sleep 60
          done
          exit 1
        env:
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}

      - name: Verify Destroy Complete (no orphan staging)
        run: |
          set -euo pipefail
          apis=$(aws apigatewayv2 get-apis --query "Items[?starts_with(Name, 'caseplan-staging')].Name" --output text 2>/dev/null || echo "")
          count=$(echo "$apis" | tr '\t' '\n' | grep -c . 2>/dev/null || echo "0")
          if [ "${count:-0}" -gt 0 ]; then
            echo "::warning::Staging APIs still exist after destroy: $apis. Manual cleanup may be needed."
          else
            echo "Destroy complete. No orphan staging resources."
          fi
